[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BCache"
version = "0.1.0"
description = "Bodo-powered hierarchical KV cache planner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary/Unspecified"}
authors = [
  {name = "BodoCache Authors"},
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.21",
  "pyyaml>=6.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
blake3 = ["blake3>=0.3.3"]
bodo = ["bodo"]
dev = [
  "bandit>=1.7.7",
  "black>=24.4.0",
  "commitizen>=3.23.0",
  "detect-secrets>=1.4.0",
  "mypy>=1.10.0",
  "pip-audit>=2.7.1",
  "pre-commit>=3.7.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "types-pyyaml>=6.0.12",
]

[tool.setuptools.packages.find]
include = ["bodocache*"]

[project.scripts]
bodocache-sim = "bodocache.sim.cli:main"
bcache-sim = "bodocache.sim.cli:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["bodocache", "tests"]
exclude = ["docs", "native", "segments", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["S101"]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.11"
files = ["bodocache/planner/api.py"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_optional = true
pretty = true
show_error_codes = true
allow_redefinition = true
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["bodocache"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
targets = ["bodocache"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
